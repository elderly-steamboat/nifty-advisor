[project]
name = "advisor"
version = "0.1.0"
description = "Deterministic Nifty 50 options advisor (Kronos range forecast + option chain analytics)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "einops>=0.8.2",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real Kronos model (set RUN_SLOW=1)"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
